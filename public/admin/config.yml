# Staff editor for the St. Philip website (Decap CMS).
# Staff sign in at /admin/ with a Netlify Identity account (invite-only).
# Every save commits to the GitHub repository and Netlify rebuilds the site in a minute or two.

backend:
  name: git-gateway
  branch: main

media_folder: public/uploads
public_folder: /uploads

collections:
  - name: bulletins
    label: Bulletins
    label_singular: Bulletin
    description: Upload the weekly bulletin PDF. The newest date shows on the homepage.
    folder: src/content/bulletins
    create: true
    slug: "{{year}}-{{month}}-{{day}}"
    identifier_field: title
    sortable_fields: [date, title]
    summary: "{{title}}"
    media_folder: /public/uploads/bulletins
    public_folder: /uploads/bulletins
    fields:
      - { label: Sunday date, name: date, widget: datetime, date_format: "MMMM D, YYYY", time_format: false, format: "YYYY-MM-DD", picker_utc: true }
      - { label: Title, name: title, widget: string, hint: 'For example "Bulletin for October 11, 2026"' }
      - { label: Bulletin PDF, name: file, widget: file, allow_multiple: false }

  - name: announcements
    label: Announcements
    label_singular: Announcement
    description: Short notices like "Chicken Parm Dinner this Saturday!" Each one disappears by itself after its last day.
    folder: src/content/announcements
    create: true
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    summary: "{{title}} (until {{showUntil}})"
    sortable_fields: [showUntil, title]
    fields:
      - { label: Headline, name: title, widget: string, hint: 'For example "Chicken Parm Dinner this Saturday!"' }
      - { label: Details, name: details, widget: text, required: false, hint: "Time, place, price, who to call. Keep it to a sentence or two." }
      - { label: First day to show, name: showFrom, widget: datetime, date_format: "MMMM D, YYYY", time_format: false, format: "YYYY-MM-DD", picker_utc: true }
      - { label: Last day to show, name: showUntil, widget: datetime, date_format: "MMMM D, YYYY", time_format: false, format: "YYYY-MM-DD", picker_utc: true, hint: "Usually the day of the event. It disappears the next day." }
      - { label: Also show as a banner at the top of every page, name: banner, widget: boolean, default: false, required: false }
      - { label: Link (optional), name: link, widget: string, required: false, hint: "A web address, or a page on this site like /parish-life" }
      - { label: Link text, name: linkLabel, widget: string, required: false, default: "Learn more" }

  - name: settings
    label: Mass times & parish info
    editor: { preview: false }
    files:
      - name: parish
        label: Mass times, phone, email and staff
        file: src/data/settings.json
        fields:
          - label: Mass and Confession times
            name: schedules
            widget: list
            summary: "{{fields.label}}"
            fields:
              - { label: Heading, name: label, widget: string }
              - { label: Lines, name: times, widget: list, field: { label: Line, name: line, widget: string } }
              - { label: Small note, name: note, widget: string, required: false }
          - { label: Note shown beside the times, name: noMassNote, widget: string, required: false }
          - { label: Phone, name: phone, widget: string }
          - { label: Email, name: email, widget: string, required: false }
          - { label: Office hours, name: officeHours, widget: string }
          - { label: Online giving link, name: givingUrl, widget: string, required: false }
          - label: Staff
            name: staff
            widget: list
            summary: "{{fields.name}}, {{fields.role}}"
            fields:
              - { label: Name, name: name, widget: string }
              - { label: Role, name: role, widget: string }
          - { label: Mission statement, name: mission, widget: text }
          - { label: Parish name, name: parishName, widget: hidden }
          - { label: Tagline, name: tagline, widget: hidden }
          - { label: Street address, name: address, widget: hidden }
          - { label: City, state, ZIP, name: cityStateZip, widget: hidden }
          - { label: Map link, name: mapUrl, widget: hidden }

  - name: pages
    label: Pages
    folder: src/content/pages
    create: false
    delete: false
    fields:
      - { label: Title, name: title, widget: string }
      - { label: Intro line, name: intro, widget: text }
      - { label: Page text, name: body, widget: markdown }
      - label: Groups (shown as photo cards; used on Parish Life)
        name: groups
        widget: list
        required: false
        summary: "{{fields.name}}"
        media_folder: /public/uploads/groups
        public_folder: /uploads/groups
        fields:
          - { label: Name, name: name, widget: string }
          - { label: Photo, name: photo, widget: image, required: false }
          - { label: Description, name: description, widget: text, required: false, hint: "When and where it meets, and who to contact" }

  - name: sacraments
    label: Sacraments
    folder: src/content/sacraments
    create: false
    delete: false
    fields:
      - { label: Title, name: title, widget: string }
      - { label: Order, name: order, widget: number, value_type: int }
      - { label: One-line summary, name: summary, widget: string }
      - { label: Page text, name: body, widget: markdown }
